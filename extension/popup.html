<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouMentor AI</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <!-- HEADER -->

        <div class="header">

            <div class="logo">
                🎓
            </div>

            <h1>
                YouMentor AI
            </h1>

            <p>
                AI-Powered Learning Assistant
            </p>

        </div>


        <!-- AI BUTTONS -->

        <button id="summaryBtn" class="main-btn">
            📄 Generate Summary
        </button>


        <button id="explainBtn" class="main-btn">
            💡 Explain
        </button>


        <button id="quizBtn" class="main-btn">
            🎯 Take Quiz
        </button>


        <button id="vocabularyBtn" class="main-btn">
            📚 Vocabulary
        </button>


        <button id="flashcardsBtn" class="main-btn">
            🃏 Flashcards
        </button>


        <!-- OUTPUT -->

        <div id="output"></div>


        <!-- NOTES -->

        <button id="notesBtn" class="notes-btn">
            📚 My Notes
        </button>

    </div>


    <script type="module" src="popup.js"></script>

</body>

</html>
